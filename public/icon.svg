<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090D16" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00F0FF" stroke-width="12" opacity="0.7" />
  
  <!-- Central Tactile Pulse Core -->
  <circle cx="256" cy="256" r="75" fill="url(#grad1)" filter="url(#glow)" />
  
  <!-- Sound/Vibration Waves -->
  <path d="M120 256 Q 140 220 140 256 T 160 256" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M352 256 Q 372 220 372 256 T 392 256" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" fill="none" />
  
  <!-- Haptic Dot Array (Braille/Tactile touch cue) -->
  <circle cx="256" cy="120" r="10" fill="#00F0FF" />
  <circle cx="256" cy="392" r="10" fill="#00F0FF" />
  <circle cx="120" cy="256" r="10" fill="#00F0FF" />
  <circle cx="392" cy="256" r="10" fill="#00F0FF" />
</svg>
